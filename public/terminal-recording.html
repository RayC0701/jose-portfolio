<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jose Canales — Live Terminal</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D1117;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Menlo', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .terminal {
    width: 100%;
    max-width: 900px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #1C1C1E;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .dots { display: flex; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #FF5F57; }
  .dot-yellow { background: #FEBC2E; }
  .dot-green { background: #28C840; }
  .titlebar-text {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.25);
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
  }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #22C55E;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
  }
  .live-text {
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(34,197,94,0.8);
    font-weight: bold;
  }
  .body {
    background: #0D1117;
    padding: 20px 24px;
    min-height: 460px;
    max-height: 500px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .line {
    min-height: 1.6em;
    line-height: 1.6;
    font-size: 13px;
    color: #C9D1D9;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .prompt-user { color: #22C55E; }
  .prompt-sep { color: #6B7280; }
  .prompt-dir { color: #3B82F6; }
  .c-green { color: #22C55E; }
  .c-yellow { color: #EAB308; }
  .c-cyan { color: #06B6D4; }
  .c-gray { color: #6B7280; }
  .c-hash { color: #EAB308; }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: #22C55E;
    vertical-align: middle;
    margin-left: 1px;
    animation: blink 1.06s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dots">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="titlebar-text">jose@andraia — zsh — 120×40</div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <div class="live-text">Live System</div>
    </div>
  </div>
  <div class="body" id="term"></div>
</div>

<script>
const STEPS = [
  {
    command: "ssh andraia",
    output: [
      { text: "Welcome to andraia — GPU Compute Host", cls: "c-green" },
      { text: "Ubuntu 22.04.5 LTS | Kernel 6.8.0 | NVIDIA RTX A4000" },
      { text: "Uptime: 4 days, 10:17 | Load: 2.08, 2.25, 2.18" },
      { text: "Last login: Wed Jun  4 09:01:37 2026 from 100.89.x.x" },
      { text: "" },
    ],
  },
  {
    command: "docker ps --format 'table {{.Names}}\\t{{.Status}}' | head -20",
    output: [
      { text: "NAMES                    STATUS" },
      { text: "quant-engine             Up 2 days (healthy)" },
      { text: "friday                   Up 4 days (healthy)" },
      { text: "btc-dormancy-scanner     Up 4 days (healthy)" },
      { text: "it-agent-phone-service   Up 4 days (healthy)" },
      { text: "infra-n8n-1              Up 3 days (healthy)" },
      { text: "friday-neo4j             Up 4 days (healthy)" },
      { text: "quant-postgres           Up 4 days (healthy)" },
      { text: "quant-redis              Up 4 days (healthy)" },
      { text: "nvidia-gpu-exporter      Up 4 days" },
      { text: "host-stats-exporter      Up 4 days" },
      { text: "watchtower               Up 4 days (healthy)" },
      { text: "homeassistant            Up 4 days" },
      { text: "plex                     Up 4 days (healthy)" },
      { text: "gluetun                  Up 4 days (healthy)" },
      { text: "infra-postgres-1         Up 4 days (healthy)" },
      { text: "... +11 more containers", cls: "c-gray" },
      { text: "" },
    ],
  },
  {
    command: "ultron --status",
    output: [
      { text: "[INFO] Signal pipeline healthy: 43 signals/1h, 757 signals/24h", cls: "c-cyan" },
      { text: "[INFO] Finnhub API key valid (AAPL current=$312.20)", cls: "c-cyan" },
      { text: "[WARN] Model artifact is 31 days old (retrain expected weekly)", cls: "c-yellow" },
      { text: "[INFO] Cron jobs: signal_resolver ✓ circuit_breaker ✓ pg_backup ✓", cls: "c-cyan" },
      { text: "[INFO] trading_intel_collector ✓ vault_sync_heartbeat ✓", cls: "c-cyan" },
      { text: "[WARN] 4 n8n workflow failures in last 60min (31% failure rate)", cls: "c-yellow" },
      { text: "" },
      { text: "━━━ Ultron sweep: 60 checks — 54 ok, 4 warn, 0 crit ━━━", cls: "c-green" },
      { text: "" },
    ],
  },
  {
    command: "nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv",
    output: [
      { text: "utilization.gpu, memory.used, memory.total, temperature.gpu" },
      { text: "0 %, 2445 MiB, 16376 MiB, 34 °C" },
      { text: "" },
      { text: "# GPU idle — inference runs on-demand via quant-engine", cls: "c-gray" },
      { text: "" },
    ],
  },
  {
    command: "git log --oneline -5",
    output: [
      { text: "dd388c8", cls: "c-hash", rest: " feat(content): publishing last-mile — trends bridge, publisher reliability" },
      { text: "4402644", cls: "c-hash", rest: " feat(quant): VolTarget idle-cash sweep (SGOV/BIL) — opt-in" },
      { text: "c246aac", cls: "c-hash", rest: " feat(quant): go-live hardening — full VolTarget gate monitors" },
      { text: "a63ce9e", cls: "c-hash", rest: " docs(quant): correct baked-vs-bind-mounted deploy reality" },
      { text: "00a020f", cls: "c-hash", rest: " fix(quant): normalize dotted tickers for yfinance (D5)" },
      { text: "" },
    ],
  },
  {
    command: "cat /srv/agent-hub/logs/orchestrator.log | tail -5",
    output: [
      { text: "[2026-06-04T13:45:01Z] [INFO] === Orchestrator cycle start ===" },
      { text: "[2026-06-04T13:45:01Z] [INFO] === Orchestrator cycle complete ===" },
      { text: "[2026-06-04T13:50:01Z] [INFO] === Orchestrator cycle start ===" },
      { text: "[2026-06-04T13:50:01Z] [INFO] === Orchestrator cycle complete ===" },
      { text: "[2026-06-04T13:55:01Z] [INFO] === Orchestrator cycle start ===" },
      { text: "[2026-06-04T13:55:01Z] [INFO] === Orchestrator cycle complete ===" },
      { text: "" },
      { text: "# Agent hub: 2 completed tasks, orchestrator cycling every 5m", cls: "c-gray" },
      { text: "" },
    ],
  },
];

const term = document.getElementById("term");
const CHAR_MS = 35;
const LINE_MS = 25;
const CMD_PAUSE = 600;
const STEP_PAUSE = 1200;

function addLine(html) {
  const div = document.createElement("div");
  div.className = "line";
  div.innerHTML = html || "&nbsp;";
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  return div;
}

function prompt() {
  return '<span class="prompt-user">jose@andraia</span><span class="prompt-sep">:</span><span class="prompt-dir">~</span><span class="prompt-sep">$ </span>';
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function typeCommand(cmd) {
  const line = addLine(prompt() + '<span class="cursor"></span>');
  for (let i = 0; i <= cmd.length; i++) {
    line.innerHTML = prompt() + escapeHtml(cmd.slice(0, i)) + '<span class="cursor"></span>';
    term.scrollTop = term.scrollHeight;
    await sleep(CHAR_MS);
  }
  await sleep(CMD_PAUSE);
  line.innerHTML = prompt() + escapeHtml(cmd);
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderOutputLine(item) {
  if (!item.text) return "&nbsp;";
  if (item.rest !== undefined) {
    return '<span class="' + (item.cls || "") + '">' + escapeHtml(item.text) + '</span>' + escapeHtml(item.rest);
  }
  if (item.cls) {
    return '<span class="' + item.cls + '">' + escapeHtml(item.text) + '</span>';
  }
  return escapeHtml(item.text);
}

async function run() {
  while (true) {
    term.innerHTML = "";
    for (const step of STEPS) {
      await typeCommand(step.command);
      for (const item of step.output) {
        await sleep(LINE_MS);
        addLine(renderOutputLine(item));
      }
      await sleep(STEP_PAUSE);
    }
    await sleep(4000);
  }
}

/* Respect reduced motion */
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  STEPS.forEach(step => {
    addLine(prompt() + escapeHtml(step.command));
    step.output.forEach(item => addLine(renderOutputLine(item)));
  });
} else {
  run();
}
</script>
</body>
</html>
